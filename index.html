<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지 이전 안내</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      padding: 48px 56px;
      max-width: 520px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .icon {
      font-size: 48px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #111;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: #555;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      background-color: #1a1a1a;
      color: #fff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #444;
    }

    .note {
      margin-top: 24px;
      font-size: 13px;
      color: #aaa;
    }

    .note a {
      color: #888;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔗</div>
    <h1>대시보드가 이전되었습니다</h1>
    <p>
      찾고 계신 UX 대시보드는 새로운 주소로 이전되었습니다.<br />
      아래 버튼을 눌러 최신 대시보드로 이동해 주세요.
    </p>
    <p style="font-size: 13px; color: #e05a2b; margin-bottom: 24px;">
      ⚠️ 사내망으로만 접속 가능합니다.<br />
      ⚠️ 社内ネットワークからのみアクセス可能です。
    </p>
    <a class="btn" href="http://dataobs.gnst.me/pde/ux_dashboard.html" target="_blank">
      대시보드 바로가기
    </a>
    <p class="note">
      새 주소: <a href="http://dataobs.gnst.me/pde/ux_dashboard.html">dataobs.gnst.me/pde/ux_dashboard.html</a>
    </p>
  </div>
</body>
</html>
