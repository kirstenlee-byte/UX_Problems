<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지 이전 안내 / ページ移転のご案内</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
      background-color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      padding: 48px 56px;
      max-width: 560px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .icon {
      font-size: 44px;
      margin-bottom: 24px;
    }

    .title-ko {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin-bottom: 6px;
    }

    .title-jp {
      font-size: 15px;
      font-weight: 500;
      color: #888;
      margin-bottom: 28px;
    }

    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 0 0 28px;
    }

    .message {
      margin-bottom: 24px;
    }

    .message .ko {
      font-size: 15px;
      line-height: 1.7;
      color: #444;
      margin-bottom: 6px;
    }

    .message .jp {
      font-size: 13px;
      line-height: 1.7;
      color: #999;
    }

    .notice {
      background-color: #fff8f5;
      border: 1px solid #f5d5c8;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 28px;
    }

    .notice .ko {
      font-size: 13px;
      color: #c0440e;
      margin-bottom: 4px;
    }

    .notice .jp {
      font-size: 12px;
      color: #d4714a;
    }

    .btn {
      display: inline-block;
      background-color: #1a1a1a;
      color: #fff;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      transition: background-color 0.2s;
      margin-bottom: 6px;
    }

    .btn:hover {
      background-color: #444;
    }

    .btn-jp {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: #aaa;
      margin-bottom: 24px;
    }

    .note {
      font-size: 12px;
      color: #bbb;
    }

    .note a {
      color: #999;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔗</div>

    <div class="title-ko">대시보드가 이전되었습니다</div>
    <div class="title-jp">ダッシュボードが移転しました</div>

    <hr class="divider" />

    <div class="message">
      <div class="ko">찾고 계신 UX 대시보드는 새로운 주소로 이전되었습니다.<br />아래 버튼을 눌러 최신 대시보드로 이동해 주세요.</div>
      <div class="jp">お探しのUXダッシュボードは新しいアドレスに移転しました。<br />下のボタンから最新ダッシュボードへお進みください。</div>
    </div>

    <div class="notice">
      <div class="ko">⚠️ 사내망으로만 접속 가능합니다.</div>
      <div class="jp">⚠️ 社内ネットワークからのみアクセス可能です。</div>
    </div>

    <a class="btn" href="http://dataobs.gnst.me/pde/ux_dashboard.html" target="_blank">대시보드 바로가기</a>
    <span class="btn-jp">ダッシュボードへ</span>

    <div class="note">
      새 주소 / 新しいアドレス:<br />
      <a href="http://dataobs.gnst.me/pde/ux_dashboard.html">dataobs.gnst.me/pde/ux_dashboard.html</a>
    </div>
  </div>
</body>
</html>
